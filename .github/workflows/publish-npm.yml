name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch: # manual retry from main

permissions:
  contents: read
  id-token: write # OIDC for trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed to check the tag is on main

      - name: Check tag is on main
        if: github.event_name == 'release'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag ${GITHUB_REF_NAME} is not on main"; exit 1; }

      - name: Check manual run is on main
        if: github.event_name == 'workflow_dispatch'
        run: '[ "$GITHUB_REF" = "refs/heads/main" ] || { echo "Manual publish is only allowed from main"; exit 1; }'

      - name: Check tag matches package version
        if: github.event_name == 'release'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} != v${VERSION} (package.json)"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Upgrade npm
        run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Build and test library
        run: npm run build

      - name: Verify package contents (dry run)
        run: |
          npm publish --dry-run --access public
          npm pack --dry-run --json | node .github/scripts/check-package-files.mjs

      - name: Publish package to npm
        run: npm publish --access public --provenance
